
name: Deploy Angular Website to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production,github-pages --base-href /hhm-global-accounting/

      - name: Configure GitHub Pages fallback
        run: cp dist/HHM_Global_Accounting/browser/index.html dist/HHM_Global_Accounting/browser/404.html

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/HHM_Global_Accounting/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
