
<header class="site-header">
  <nav class="navbar" aria-label="Primary navigation">

    <!-- Logo -->
    <a
      class="brand"
      routerLink="/"
      aria-label="HHM Global Accounting home"
      (click)="closeMenu()"
    >
      <img src="Logo.png" alt="HHM Global Accounting" />
    </a>

    <!-- Mobile Menu Toggle -->
    <button
      class="menu-toggle"
      type="button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="primary-menu"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <div
      class="nav-panel"
      [class.is-open]="isMenuOpen()"
      id="primary-menu"
    >
      <ul class="nav-list">

        @for (item of navItems; track item.label) {
          <li
            class="nav-item"
            [class.has-dropdown]="item.children"
            [class.dropdown-open]="openDropdown() === item.label"
          >

            @if (item.dropdownOnly) {

              <button
                class="nav-link dropdown-trigger"
                type="button"
                [attr.aria-expanded]="openDropdown() === item.label"
                (click)="toggleDropdown(item.label)"
              >
                <span>{{ item.label }}</span>
                <span class="chevron" aria-hidden="true"></span>
              </button>

            } @else {

              <a
                class="nav-link"
                [routerLink]="item.href"
                (click)="closeMenu()"
              >
                <span>{{ item.label }}</span>

                @if (item.children) {
                  <span class="chevron" aria-hidden="true"></span>
                }
              </a>

            }

            @if (item.children) {
              <ul
                class="dropdown"
                [attr.aria-label]="item.label + ' submenu'"
              >

                @for (child of item.children; track child.label) {
                  <li>
                    <a
                      [routerLink]="child.href"
                      (click)="closeMenu()"
                    >
                      {{ child.label }}
                    </a>
                  </li>
                }

              </ul>
            }

          </li>
        }

      </ul>

      <!-- Schedule Button -->
      <a
        class="schedule-button"
        href="https://calendly.com/"
        target="_blank"
        rel="noopener"
        (click)="closeMenu()"
      >
        Schedule A Call
      </a>

    </div>
  </nav>
</header>
